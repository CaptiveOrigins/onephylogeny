<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnePhylogeny playground</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { margin: 0; padding: 1.5rem; font-family: system-ui, sans-serif; color: #1d2330; }
      @media (prefers-color-scheme: dark) { body { background: #12151b; color: #e8ecf2; } button { color: inherit; background: #1f2430; border: 1px solid #2c3340; } }
      h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
      nav { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
      nav button[aria-pressed='true'] { font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
  </body>
</html>
