# OnePhylogeny for Mac: on a desktop-v* tag, build a universal app and publish a GitHub release.
# To ship signed updates, add the TAURI_SIGNING_PRIVATE_KEY secret and set bundle.createUpdaterArtifacts in
# tauri.conf.json. Apple notarization (APPLE_* secrets) can be added later; until then macOS asks people to
# confirm the first launch (Open Anyway in Privacy & Security, or xattr on that one app). IQ-TREE is optional and not bundled.
name: Desktop app

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '!onephylogeny-desktop' build
      # The region map's outlines ship inside the app (ADR 0008), so people have nothing to fetch or choose. Built here
      # from the official RESOLVE release (about 150 MB down, about 8 MB in the app); the log prints the SHA-256.
      - run: npm install -g mapshaper@0.7.101
      - run: node scripts/ecoregions.mjs apps/desktop/src-tauri/resources/ecoregions.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'OnePhylogeny for Mac ${{ github.ref_name }}'
          releaseBody: |
            Download the .dmg below and drag OnePhylogeny to Applications.

            The app isn't notarized, so macOS blocks the first launch. Use either way past the warning:

            - **System Settings:** try to open the app once, then go to System Settings > Privacy & Security, scroll down, click **Open Anyway**, and click **Open** when the warning comes back. Apple says to do this only for an app you trust.
            - **Terminal:** `xattr -dr com.apple.quarantine "/Applications/OnePhylogeny.app"`

            The app can't update itself yet. To update, download the newest .dmg from this repository's Releases page.

            Early alpha: results are not forensically validated. A person hasn't yet worked through this build in the Mac app; only its automated tests have run. See CHANGELOG.md for what changed.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
          includeUpdaterJson: true
